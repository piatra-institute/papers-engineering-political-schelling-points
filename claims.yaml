- id: abs-coord-share
  kind: computation
  passage: The equilibrium cutoff decomposes exactly into a closed-form evidential channel and a coordination channel equal to an explicit, reach-dependent multiplier on it; at baseline coordination is 80% of the effect when receipt is common knowledge.
  evidence:
    file: simulation/output/results.json
    run_id: model
    pointer: /decomposition/by_reach/1.00/coordination_share
    reported: 80%
    scale: 100
    decimals: 0
    units: percent of the cutoff shift
    conditions: baseline parameters alpha = 4, mu = 0.6, beta = 25, c = 0.5; tau = 1; reach 1; baseline mobilizing message z = theta0 - 0.3
