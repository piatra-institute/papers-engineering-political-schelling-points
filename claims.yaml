- id: src-ahp2007-static
  kind: source
  passage: In the static regime-change game with a normal prior of precision $\alpha$ and normal private signals of precision $\beta$, the equilibrium is unique if and only if $\beta \ge \alpha^2/(2\pi)$, and the success threshold converges to $1-c$ as private noise vanishes [@angeletos2007, p. 719].
  evidence:
    citation_id: angeletos2007
    locator: Proposition 1, p. 719
    depth: fulltext
    quote: In the static game, the equilibrium is unique if and only if β ≥ α2 /(2π) and is in monotone strategies.
    verified: false
    verification_note: Read the author-hosted version of record (Northwestern, Dynamics-final.pdf, sha256 e4fe0cd9...). Proposition 1 states the static uniqueness condition; the next sentence gives the limit threshold 1 - c as beta grows. Same notation as this paper.
- id: src-ahp2007-dynamic
  kind: source
  passage: Angeletos, Hellwig and Pavan showed that the information generated by a policy maker's intervention restores multiple equilibria [@angeletos2006], and that in a dynamic regime-change game with learning, multiplicity can arise under the same conditions that guarantee uniqueness in the static game, with phases of tranquillity and of attack that occur without changes in fundamentals [@angeletos2007].
  evidence:
    citation_id: angeletos2007
    locator: abstract, p. 711
    depth: fulltext
    quote: First, multiplicity may obtain under the same conditions on exogenous information that guarantee uniqueness in the static benchmark.
    verified: false
    verification_note: Abstract of the author-hosted version of record read in full.
- id: src-hellwig
  kind: source
  passage: Hellwig showed that multiple equilibria become possible when the overall level of noise is low and public information is relatively informative [@hellwig2002].
  evidence:
    citation_id: hellwig2002
    locator: working-paper abstract (LSE FMG DP 361)
    depth: abstract
    quote: I also find that in general, the possibility of coordination is more likely to arise when the overall level of noise is low and when the public information is relatively informative.
    verified: false
    verification_note: Published article and abstract not obtained (publisher blocked). Read the scanned abstract of LSE FMG Discussion Paper 361 (October 2000, same title) as a page image; sha256 76b59459.... The paraphrase follows the working paper's abstract.
- id: src-ms2002
  kind: source
  passage: In a beauty-contest economy Morris and Shin showed that agents give the public signal more weight than its relative precision, a reflection of the coordination motive, and that when that motive is strong more precise public information lowers welfare if private information is precise enough [@morris2002].
  evidence:
    citation_id: morris2002
    locator: CFDP 1312 working paper, pp. 15-16
    depth: fulltext
    quote: The noise in the public signal is given relatively more weight, and the noise in the private signal is given relatively less weight. This feature reflects the coordination motive of the agents
    verified: false
    verification_note: Read the working-paper version (Cowles Foundation Discussion Paper 1312, 'The CNBC Effect', July 2001) from page images because its font is shifted; published AER article not read. Equilibrium action (2.12) and condition (3.5); welfare can fall with public precision only when r > 0.5.
- id: src-ms2003
  kind: source
  passage: Their survey calls the disproportionate impact of public information a publicity effect and notes that its multiplier is largest just before the parameters enter the region of multiple equilibria [@morris2003].
  evidence:
    citation_id: morris2003
    locator: CFDP 1275R working paper, pp. 30-32
    depth: fulltext
    quote: The multiplier is biggest just before we hit the multiplicity zone of the parameter space
    verified: false
    verification_note: Read CFDP 1275R (August 2001) from page images (shifted font); the published Cambridge chapter was not obtained. The passage concerns the linear investment example of section 3, not the regime-change game.
- id: src-ahp2006
  kind: source
  passage: Angeletos, Hellwig and Pavan showed that the information generated by a policy maker's intervention restores multiple equilibria [@angeletos2006], and that in a dynamic regime-change game with learning, multiplicity can arise under the same conditions that guarantee uniqueness in the static game, with phases of tranquillity and of attack that occur without changes in fundamentals [@angeletos2007].
  evidence:
    citation_id: angeletos2006
    locator: abstract, pp. 452-453
    depth: fulltext
    quote: we show that the endogenous information generated by policy interventions leads to multiple equilibria.
    verified: false
    verification_note: Read the author-hosted typeset version. The abstract adds that the result does not rely on the policy being a public signal; the sentence avoids that claim.
- id: src-edmond
  kind: source
  passage: Edmond studied a regime that can engage in propaganda that, taken at face value, makes it seem stronger than it is; holding the number of signals fixed, the regime is harder to overthrow when each signal is precise, while adding signals, which raises both their total precision and the regime's cost of manipulation, makes it easier to overthrow unless information control has strong economies of scale [@edmond2013].
  evidence:
    citation_id: edmond2013
    locator: published abstract
    depth: abstract
    quote: Holding fixed the number of signals available to citizens, if the per-unit signal precision is sufficiently high then the regime is harder to overthrow.
    verified: false
    verification_note: Published abstract read via OpenAlex; NBER WP 17395 also read, whose abstract frames the comparative statics differently; the sentence paraphrases the published abstract only.
- id: src-little2016
  kind: source
