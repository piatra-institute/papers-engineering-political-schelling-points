- id: as-skeleton
  kind: assumption
  passage: Its deterministic skeleton sets $\xi_t = 0$.
  rationale: The skeleton is the noise-free limit; belief-consistent shocks are reported alongside.
- id: int-exposure
  kind: interpretation
  passage: Eady and colleagues' null finding on attitudes and votes [@eady2023] concerns a population in which exposure was concentrated in a small share of users; the model implies that an exposure effect measured at one commonly believed reach does not bound the effect of the same messages when receipt is common knowledge, because the multiplier depends on reach.
  rationale: Follows from the dependence of the multiplier on reach (Proposition 1(iv)); no claim about the campaign Eady and colleagues studied.
- id: int-correction
  kind: normative
  passage: Institutions that publish verified counts of independent participation in a channel everyone knows everyone watches supply the common-knowledge form of correction.
  rationale: Policy implication drawn from Theorem 1(a)-(b); the model does not evaluate costs or risks of such institutions.
