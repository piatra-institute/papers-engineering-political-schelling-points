    file: simulation/output/results.json
    run_id: model
    pointer: /decomposition/kappa
    reported: 80%
    scale: 100
    decimals: 0
    units: percent of the marginal response (kappa v at v = 1)
    conditions: baseline parameters alpha = 4, mu = 0.6, beta = 25, c = 0.5; tau = 1; neutral message
