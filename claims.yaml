- id: as-unaware
  kind: assumption
  passage: Non-receivers do not condition on the message and play the equilibrium of the game without it; the experimental section checks this simplification against a common-prior version in which non-receivers know that a message was shown to some share but not what it said.
  rationale: Simplifies the equilibrium to one equation. Checked against the common-prior version with informed non-receivers (aware.py), which changes receivers' predicted participation by at most 1.8% of the largest effect.
- id: as-provenance
  kind: assumption
  passage: Provenance enters the model only through perceived precision.
  rationale: Disclosure is modelled as a change in perceived precision; any effect of provenance on valuations (for example resentment at manipulation) would act like valuation persuasion.
- id: def-reach
  kind: definition
  passage: I call $v$ the commonly believed reach, or reach for short.
  rationale: Reach is the common belief of receipt among receivers (common p-belief with p = v); actual receipt v_a is a separate quantity.
- id: def-neglect
  kind: definition
  passage: Two things can make a receiver's perceived precision differ from the true one, and the model keeps them apart.
  rationale: Separates ignorance of the source structure (believed correlation r_b) from neglect of a known correlation (chi), following the referee's finding F3; before disclosure tau_h = n rho, after tau_l = n rho/(1 + (n - 1)(1 - chi')).
