- id: def-example
  kind: definition
  passage: A call to stop work at noon on Friday circulates in a city's feeds, posted by eighty accounts that look unrelated.
  rationale: 'Illustrative scenario: eighty accounts and one source are invented for exposition and carry no empirical claim.'
- id: def-reach
  kind: definition
  passage: Reach is the paper's measure of shared visibility; it is distinct from the number of accounts, which acts only through $\hat\tau$.
  rationale: Reach is defined as the mass of receivers among whom receipt, and the groups' perceived precisions, are common knowledge.
- id: def-evid
  kind: definition
  passage: The evidential channel is the change in the cutoff of a receiver who updates her belief about $\theta$ but expects everyone else to behave as without the message; it equals the effect at reach zero.
  rationale: Defines the evidential channel as the reach-zero effect; the coordination channel is the remainder.
- id: as-unaware
  kind: assumption
  passage: Non-receivers do not condition on the message and play the equilibrium of the game without it.
  rationale: Simplifies the equilibrium to one equation. Checked against the common-prior version with informed non-receivers (aware.py), which changes receivers' predicted participation by at most 1.8% of the largest effect.
- id: as-provenance
  kind: assumption
  passage: Provenance enters the model only through perceived precision.
  rationale: Disclosure is modelled as a change in perceived precision; it ignores any effect of provenance on valuations (for example resentment at manipulation), which would act like valuation persuasion.
- id: as-skeleton
  kind: assumption
  passage: The deterministic skeleton sets each period's fundamental equal to its public expectation.
  rationale: Makes persistence a property of a deterministic map; the shock simulations quantify how much persistence survives when the fundamental varies.
- id: int-parasitic
  kind: interpretation
  passage: Coordination value therefore multiplies evidential value; it cannot exist without it somewhere in the belief hierarchy.
  rationale: Follows from Proposition 2(i)-(ii) under uniqueness; with multiple equilibria a commonly known uninformative message could select an equilibrium.
- id: int-exposure
  kind: interpretation
  passage: Eady and colleagues' null finding on attitudes and votes [@eady2023] concerns a population in which exposure was concentrated in a small share of users; the model implies that an exposure effect measured at one reach does not bound the effect of the same messages when receipt is common knowledge, because the multiplier depends on reach.
  rationale: Follows from the dependence of the multiplier on reach (Proposition 1(iv)); it does not claim that the campaign studied by Eady and colleagues had any effect.
- id: int-detect
  kind: interpretation
  passage: The value of early detection is concentrated in the periods before that crossing.
  rationale: Follows from Proposition 3(ii) and the disclosure-timing computation in the deterministic skeleton.
- id: int-correction
  kind: normative
  passage: Institutions that publish verified counts of independent participation in a channel everyone knows everyone watches supply the common-knowledge form of correction.
  rationale: 'Policy implication drawn from Theorem 1(a)-(b): only common-knowledge corrections remove coordination value; the model does not evaluate costs or risks of such institutions.'
