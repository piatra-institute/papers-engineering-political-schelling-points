web_blurb: When many accounts amplify a call to collective action, the message works both as evidence that the action can succeed and as a shared reference for predicting others. A global-game model shows that disclosing a common source removes coordination only when the disclosure is commonly known, and that publicity multiplies a message's evidential effect but gives an uninformative message none.
